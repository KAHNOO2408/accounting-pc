name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - name: Generate Windows runner (first time only)
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create --platforms=windows --project-name taraz --org ir.taraz .
          }
          # template test that does not apply to this app
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue

      - name: Window title, size and icon
        shell: pwsh
        run: |
          $f = "windows/runner/main.cpp"
          $c = Get-Content $f -Raw
          $c = $c -replace 'Win32Window::Size size\(\d+, \d+\);', 'Win32Window::Size size(1440, 900);'
          $c = $c -replace 'L"taraz"', 'L"Taraz"'
          Set-Content -Path $f -Value $c -NoNewline
          Copy-Item assets/app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Tests (logic + UI smoke test)
        continue-on-error: true
        shell: pwsh
        run: |
          flutter test --reporter expanded 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content test.log | Select-String -Pattern 'FAILED|Expected|Actual|Exception|Error|error|overflowed|\[E\]|test/app_test.dart|lib/' | Select-Object -First 80
            $msg = ($lines | ForEach-Object { $_.Line.Trim() }) -join '%0A'
            Write-Output "::error title=tests::$msg"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content build.log | Select-String -Pattern 'error|Error|failed|Failed|\.dart:|\.cpp|\.h\(|MSB|CMake' | Select-Object -First 80
            $msg = ($lines | ForEach-Object { $_.Line.Trim() }) -join '%0A'
            Write-Output "::error title=build::$msg"
            exit 1
          }

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Taraz-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Taraz-windows
          path: Taraz-windows.zip
